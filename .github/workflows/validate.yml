name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
            pillow: 'Pillow==10.1.0'
          - os: windows-latest
            python: '3.13'
            pillow: Pillow
          - os: macos-15-intel
            python: '3.13'
            pillow: Pillow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt "${{ matrix.pillow }}"
      - name: Validate skill and public source
        run: python scripts/validate_project.py
      - name: Test skill helpers
        run: python -m unittest discover -s skills/assetrefgen/scripts -v
      - name: Test public examples and release archives
        run: python -m unittest discover -s tests -v
