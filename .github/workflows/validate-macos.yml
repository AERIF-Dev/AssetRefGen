name: macOS compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: macos-15-intel / Python 3.13
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate skill and public source
        run: python scripts/validate_project.py
      - name: Test skill helpers
        run: python -m unittest discover -s skills/assetrefgen/scripts -v
      - name: Test public examples and release archives
        run: python -m unittest discover -s tests -v
